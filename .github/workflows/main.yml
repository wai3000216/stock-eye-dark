name: GitHub每日自动签到（wai3000216专用）
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新README日期
        run: |
          echo "# A股炒股VSCode护眼主题" > README.md
          echo "自动签到：$(date +%Y-%m-%d)" >> README.md
          echo "Python量化 | Ollama本地AI | 同花顺工具" >> README.md

      - name: 安全提交推送
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
