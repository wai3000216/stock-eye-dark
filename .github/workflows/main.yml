name: GitHub每日自动签到（wai3000216专用）
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新README日期
        run: |
          echo "# A股炒股VSCode护眼主题" > README.md
          echo "自动签到：$(date +%Y-%m-%d)" >> README.md
          echo "Python量化 | Ollama本地AI | 同花顺工具" >> README.md

      - name: Git提交更新
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "每日自动签到更新"
          git push
